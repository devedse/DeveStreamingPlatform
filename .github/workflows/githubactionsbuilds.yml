name: CI Pipeline

on: push

jobs:
  generate_version_number:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.buildnumber.outputs.build_number }}
    steps:
    - name: Generate build number
      id: buildnumber
      uses: onyxmueller/build-tag-number@v1
      with:
        token: ${{secrets.github_token}}

  build_and_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 10
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: 'pnpm'
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Audit dependencies
      run: pnpm audit --audit-level=moderate
    - name: Build
      run: pnpm run build
    - name: Run tests
      run: pnpm run test:run

  build_docker:
    needs: [generate_version_number, build_and_test]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Login to Docker Hub
      if: github.event_name == 'push' && github.actor != 'dependabot[bot]'
      uses: docker/login-action@v4
      with:
        username: devedse
        password: ${{ secrets.DOCKERHUBTOKEN }}
    - name: Set up QEMU
      id: qemu
      uses: docker/setup-qemu-action@v4
      with:
        image: tonistiigi/binfmt:latest
        platforms: all
    - name: Available platforms
      run: echo ${{ steps.qemu.outputs.platforms }}
    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v4
    - name: Builder instance name
      run: echo ${{ steps.buildx.outputs.name }}
    - name: Available platforms
      run: echo ${{ steps.buildx.outputs.platforms }}
    - name: Set Image Tags
      id: tags
      env:
        BUILD_NUMBER: ${{ needs.generate_version_number.outputs.build_number }}
      run: |
        VERSION="1.0.${BUILD_NUMBER}"
        echo "Version: $VERSION"
        echo "github.ref: $GITHUB_REF"
        echo "github.actor: $GITHUB_ACTOR"
        echo "branch name: ${GITHUB_REF#refs/heads/}"
        BRANCH_NAME="${GITHUB_REF#refs/heads/}"
        BRANCH_NAME="${BRANCH_NAME//\//-}"
        echo "parsed branch name: ${BRANCH_NAME}"

        echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

        if [[ "$GITHUB_REF" == 'refs/heads/master' ]]; then
          echo "TAGS=-t devedse/devestreamingplatform:${VERSION} -t devedse/devestreamingplatform:latest -t devedse/devestreamingplatform:beta_nightly" >> "$GITHUB_OUTPUT"
        elif [[ "$GITHUB_ACTOR" == 'dependabot[bot]' ]]; then
          echo "TAGS=-t devedse/devestreamingplatform:beta_${BRANCH_NAME}" >> "$GITHUB_OUTPUT"
        else 
          echo "TAGS=-t devedse/devestreamingplatform:beta_${BRANCH_NAME} -t devedse/devestreamingplatform:beta_nightly" >> "$GITHUB_OUTPUT"
        fi
    - name: Run Buildx
      env:
        BUILD_VERSION: ${{ steps.tags.outputs.version }}
        DOCKER_TAGS: ${{ steps.tags.outputs.tags }}
        PUBLISH_IMAGE: ${{ github.event_name == 'push' && github.actor != 'dependabot[bot]' }}
      run: |
        read -r -a tag_args <<< "$DOCKER_TAGS"
        publish_args=()
        if [[ "$PUBLISH_IMAGE" == 'true' ]]; then
          publish_args+=(--push)
        fi
        docker buildx build --pull --no-cache -f Dockerfile --build-arg "BUILD_VERSION=$BUILD_VERSION" --platform linux/arm64,linux/amd64 "${tag_args[@]}" "${publish_args[@]}" .

  release_github:
    permissions:
      contents: write
    needs: [generate_version_number, build_docker]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: 1.0.${{needs.generate_version_number.outputs.build_number}}
        name: 1.0.${{needs.generate_version_number.outputs.build_number}}
        body: |
          ${{ github.event.head_commit.message }}
        fail_on_unmatched_files: true
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
